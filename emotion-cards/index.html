<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#faf4e9"><title>小栖的情绪英语卡片</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f0e7;color:#2c2925;font-family:system-ui,-apple-system,'PingFang SC',sans-serif}.app{max-width:510px;margin:auto;padding:24px 18px 45px}header{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:21px;margin:8px 0 4px}.sub{color:#817565;font-size:13px}.pill{border-radius:99px;padding:7px 12px;background:#e9e0d1;font-size:12px}nav{display:flex;gap:7px;overflow-x:auto;padding:24px 0 14px}button{font:inherit;cursor:pointer}nav button{white-space:nowrap;border:1px solid #ddd1c1;border-radius:30px;padding:9px 13px;background:transparent;color:#675c4f}nav button.active{background:#352e28;color:white}.card{background:#fffaf0;border:1px solid #e8dece;border-radius:23px;min-height:425px;padding:28px 24px;box-shadow:0 14px 35px #3b302113}.eyebrow{letter-spacing:1.4px;font-size:10px;color:#9c8262;font-weight:700}.zh{font-size:34px;font-weight:800;margin:25px 0 14px}.en{font-size:30px;font-weight:750;line-height:1.3;margin:16px 0}.meaning{color:#6f6051;font-size:15px;line-height:1.7}.example{background:#f1e8d9;padding:17px;border-radius:14px;margin-top:24px}.example small{font-size:11px;color:#8e785e}.example p{margin:9px 0 4px;line-height:1.6}.translation{color:#756655;font-size:14px}.note{font-size:13px;color:#84705c;line-height:1.65;margin-top:17px}.controls{display:flex;justify-content:space-between;align-items:center;margin:20px 0}.controls button,.action{background:#342e29;color:white;border:0;border-radius:12px;padding:12px 19px}.controls button:disabled{opacity:.35}.count{color:#877a69;font-size:13px}.actions{display:flex;gap:9px}.action{flex:1;background:#e7ddcd;color:#43372c}.footer{font-size:12px;color:#8c806f;text-align:center;margin-top:30px}#toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#302b26;color:white;padding:10px 20px;border-radius:12px;display:none}</style></head><body><main class="app"><header><div><div class="sub">小栖在折腾 · 免费英语卡片</div><h1>中文情绪 → 真实英语</h1></div><span class="pill">20 CARDS</span></header><p class="sub">不背万能翻译，只学真实语境里的表达。</p><nav id="tabs" aria-label="情绪分类"></nav><section class="card" id="card" aria-live="polite"></section><div class="controls"><button id="prev">← 上一张</button><span class="count" id="count"></span><button id="next">下一张 →</button></div><div class="actions"><button class="action" id="copy">复制本张表达</button><button class="action" id="random">随机抽一张 🎲</button></div><div class="footer">同一句中文可能有很多英文说法，语气和场景最重要。<br>© 小栖在折腾</div></main><div id="toast" role="status"></div><script>
const data=[
['无语崩溃','我服了','I can’t even.','无语到说不下去；常带夸张、吐槽语气。','He forgot my birthday again. I can’t even.','他又忘了我生日，我真的服了。','也可以表示太激动而说不出话，具体看语境。'],
['无语崩溃','搞什么啊','What the heck?','惊讶、困惑或轻度恼火。','They canceled it five minutes before the show. What the heck?','开场前五分钟取消了？搞什么啊？','比 What the fuck? 温和很多。'],
['无语崩溃','真受不了','I can’t take this anymore.','受够某个持续的状况。','The noise has been going on all night. I can’t take this anymore.','这噪声响了一整晚，我真受不了了。','语气通常比玩笑式的 I can’t even 更严肃。'],
['无语崩溃','不是吧','You’ve got to be kidding me.','不敢相信，常带失望或恼火。','Another meeting at 8 a.m.? You’ve got to be kidding me.','早上八点又要开会？不是吧。','不一定真的认为对方在开玩笑。'],
['无语崩溃','太离谱了','That’s ridiculous.','觉得某事荒唐、不合理。','They charged me for water? That’s ridiculous.','水也收费？太离谱了。','评价比较直接，面对面说时留意礼貌程度。'],
['阴阳怪气','你可真行','Nice going.','在犯错之后反讽“干得漂亮”。','You deleted the whole folder? Nice going.','你把整个文件夹删了？你可真行。','也可能是真夸奖，需结合语气。'],
['阴阳怪气','那你真棒','Good for you.','可真心祝贺，也可敷衍或讽刺。','Oh, you finished early? Good for you.','哦，你提前做完了？那你真棒。','文字里没有上下文时不要自动判定是阴阳怪气。'],
['阴阳怪气','真有你的','Of course you did.','对某人一贯的行为表示“我就知道”。','You ordered dessert before dinner? Of course you did.','你饭前就点甜点？真有你的。','既可亲昵调侃，也可能是不满。'],
['阴阳怪气','好一个借口','How convenient.','暗示事情巧得可疑，带讽刺。','Your phone died right when I called? How convenient.','我打给你时手机刚好没电？真巧啊。','字面也可以是真觉得方便。'],
['阴阳怪气','哦，是吗','Oh, really?','表示兴趣、怀疑或反问。','You never make mistakes? Oh, really?','你从来不犯错？哦，是吗？','单独一句不一定带攻击性，取决于语调。'],
['开心激动','笑死我了','I’m dead.','网络口语，表示笑到不行。','That comment took me out. I’m dead.','那条评论给我笑死了。','夸张网络表达，不是字面死亡。'],
['开心激动','太绝了','That’s iconic.','夸某个行为或瞬间令人印象深刻。','She showed up in that outfit? That’s iconic.','她穿那套衣服出场？太绝了。','常用于流行文化、时尚或戏剧性场面。'],
['开心激动','谁懂啊','If you know, you know.','只有经历过的人才懂。','Late-night noodles after exams. If you know, you know.','考完试深夜吃面，谁懂啊。','更接近“懂的都懂”，不是所有“谁懂啊”都适用。'],
['开心激动','我太爱了','I’m obsessed.','特别喜欢某件事物。','I’m obsessed with this song.','这首歌我真的太爱了。','日常夸张表达，不一定是字面意义的痴迷。'],
['开心激动','太好笑了','That’s hilarious.','觉得非常好笑。','The ending was hilarious.','结尾太好笑了。','比 That’s funny 强烈一些。'],
['社交日常','随便吧','Whatever works for you.','你怎么方便就怎么来。','We can meet at six or seven—whatever works for you.','六点七点都行，看你方便。','通常比冷淡的 Whatever. 更友好。'],
['社交日常','我也是','Same here.','表示自己情况相同。','I’m exhausted today. — Same here.','我今天累坏了。——我也是。','比 Me too 更口语化的一种回应。'],
['社交日常','别闹了','Come on.','催促、劝说、表达不信或不满。','Come on, you know I didn’t mean that.','别闹了，你知道我不是那个意思。','语境不同也可能是“加油”“快点”。'],
['社交日常','没事啦','No worries.','安慰对方，不用担心。','Sorry I’m late. — No worries.','抱歉迟到了。——没事啦。','常用于轻松、非正式场合。'],
['社交日常','懂你意思','I get what you mean.','理解对方想表达的意思。','It’s hard to explain. — I get what you mean.','很难解释。——我懂你意思。','理解不代表一定同意。']
];
const cats=['全部','无语崩溃','阴阳怪气','开心激动','社交日常'];let cat='全部',index=0,filtered=data;
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){filtered=cat==='全部'?data:data.filter(x=>x[0]===cat);index=Math.max(0,Math.min(index,filtered.length-1));let x=filtered[index];document.getElementById('tabs').innerHTML=cats.map(c=>`<button class="${c===cat?'active':''}" data-cat="${c}">${c}</button>`).join('');document.getElementById('card').innerHTML=`<div class="eyebrow">CHINESE MOOD → REAL ENGLISH · ${esc(x[0])}</div><div class="zh">“${esc(x[1])}”</div><div class="en">${esc(x[2])}</div><div class="meaning">${esc(x[3])}</div><div class="example"><small>真实使用场景</small><p>${esc(x[4])}</p><div class="translation">${esc(x[5])}</div></div><div class="note">💡 ${esc(x[6])}</div>`;document.getElementById('count').textContent=`${index+1} / ${filtered.length}`;document.getElementById('prev').disabled=index===0;document.getElementById('next').disabled=index===filtered.length-1;}
document.getElementById('tabs').onclick=e=>{let c=e.target.closest('[data-cat]');if(c){cat=c.dataset.cat;index=0;render()}};document.getElementById('prev').onclick=()=>{index--;render()};document.getElementById('next').onclick=()=>{index++;render()};document.getElementById('random').onclick=()=>{index=Math.floor(Math.random()*filtered.length);render()};document.getElementById('copy').onclick=async()=>{let x=filtered[index],s=`${x[1]} → ${x[2]}\n${x[3]}\n例句：${x[4]}\n${x[5]}\n注意：${x[6]}`;try{await navigator.clipboard.writeText(s);toast('已复制卡片')}catch{toast('复制失败，请长按文字复制')}};function toast(s){let e=document.getElementById('toast');e.textContent=s;e.style.display='block';setTimeout(()=>e.style.display='none',1800)}let sx=0;document.getElementById('card').addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});document.getElementById('card').addEventListener('touchend',e=>{let d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>60){index=Math.max(0,Math.min(filtered.length-1,index+(d<0?1:-1)));render()}},{passive:true});render();
</script></body></html>
